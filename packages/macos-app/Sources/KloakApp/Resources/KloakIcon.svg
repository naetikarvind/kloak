<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient from icon.json -->
    <linearGradient id="bg-grad" x1="50%" y1="0%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#5936FF"/>
      <stop offset="100%" stop-color="#8C19D8"/>
    </linearGradient>

    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="element-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <clipPath id="squircle-clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#tile-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg-grad)"/>
  </g>

  <g clip-path="url(#squircle-clip)">
    <!-- Inner highlight -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

    <!-- Shackle Layer -->
    <g filter="url(#element-shadow)" transform="translate(-0.64, -50.06)">
      
  <defs>
    <linearGradient id="shackleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <path d="M 360 400 L 360 280 A 152 152 0 0 1 664 280 L 664 400" 
        fill="none" stroke="url(#shackleGrad)" stroke-width="64" stroke-linecap="round" />


    </g>

    <!-- Shield Body (Left & Right) -->
    <g filter="url(#element-shadow)" transform="translate(0, -15.88) scale(1.06)" transform-origin="512 512">
      
  <defs>
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
  </defs>
  <path d="M 512 280 L 224 360 L 224 640 C 224 820 512 940 512 940 Z" 
        fill="url(#shieldLeft)" />


      
  <defs>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>
  <path d="M 512 280 L 800 360 L 800 640 C 800 820 512 940 512 940 Z" 
        fill="url(#shieldRight)" />


    </g>

    <!-- Shield Outline -->
    <g transform="translate(0, -17.84) scale(1.08)" transform-origin="512 512">
      
  <path d="M 512 280 L 800 360 L 800 640 C 800 820 512 940 512 940 C 512 940 224 820 224 640 L 224 360 Z" 
        fill="none" stroke="#7DD3FC" stroke-width="16" stroke-linejoin="round" />


    </g>

    <!-- Glowing K Layer -->
    <g filter="url(#element-shadow)">
      
  <defs>
    <filter id="k-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.49
        0 0 0 0 0.82
        0 0 0 0 0.98
        0 0 0 1 0" in="glow1" result="colorGlow" />
      <feComposite in="SourceGraphic" in2="colorGlow" operator="over" />
    </filter>
  </defs>
  <path d="M 377 440 L 437 440 L 437 760 L 377 760 Z M 437 620 L 557 440 L 637 440 L 487 650 L 647 760 L 557 760 L 437 640 Z" 
        fill="#FFFFFF" filter="url(#k-glow)" />


    </g>
  </g>
</svg>