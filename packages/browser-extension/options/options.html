<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kloak Extension Options</title>
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    h2 { font-size: 16px; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.5; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🛡️ Kloak Extension Settings</h1>
  <p>Configure local Native Messaging host bridge and autofill behaviors.</p>

  <div class="card">
    <h2>Native Messaging Host</h2>
    <p>Target: <code>app.kloak.native</code> (Local IPC Daemon)</p>
    <div class="status-badge">● Native Bridge Ready</div>
  </div>

  <div class="card">
    <h2>Autofill Security</h2>
    <p>Phishing resistance: Strict eTLD+1 Origin Verification is permanently active.</p>
  </div>
  <script src="../dist/options.js"></script>
</body>
</html>
