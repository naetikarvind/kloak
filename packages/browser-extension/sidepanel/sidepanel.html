<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kloak Vault Panel</title>
  <style>
    :root {
      --bg-base: #16151D;
      --bg-card: #211F2D;
      --bg-card-hover: #292738;
      --bg-input: #111017;
      --bg-btn: #272535;
      --bg-btn-hover: #333045;
      --border: #2C293D;
      --border-card: #2F2C3F;
      --accent: #6D4AFF;
      --accent-hover: #7E5EFF;
      --text-main: #FFFFFF;
      --text-muted: #9E9AA8;
      --text-subtle: #736F80;
      --danger: #F54A4A;
      --success: #29C98F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── HEADER ── */
    .header {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-shield {
      width: 22px;
      height: 22px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-shield svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-header {
      background: var(--bg-btn);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-header:hover {
      background: var(--bg-btn-hover);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .btn-header svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* ── MAIN CONTENT CONTAINERS ── */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 12px;
    }

    /* ── UNLOCK VIEW ── */
    .unlock-card {
      background: var(--bg-card);
      border: 1px solid rgba(109, 74, 255, 0.28);
      border-radius: 14px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(109, 74, 255, 0.12);
      margin-top: 16px;
    }
    .unlock-icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: radial-gradient(circle, rgba(109, 74, 255, 0.3) 0%, rgba(109, 74, 255, 0.08) 100%);
      border: 1px solid rgba(109, 74, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #B098FF;
      margin-bottom: 14px;
    }
    .unlock-icon-badge svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
    .unlock-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .unlock-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .unlock-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-box {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
      width: 100%;
    }
    .input-box input::placeholder {
      color: var(--text-muted);
    }
    .input-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .input-icon-btn:hover {
      color: var(--text-main);
    }
    .input-icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .unlock-error {
      color: var(--danger);
      font-size: 11px;
      background: rgba(245, 74, 74, 0.12);
      border: 1px solid rgba(245, 74, 74, 0.3);
      border-radius: 6px;
      padding: 6px 10px;
      display: none;
      text-align: left;
    }
    .btn-submit {
      height: 38px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── UNLOCKED VAULT LIST VIEW ── */
    .search-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .search-box svg {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
      width: 100%;
    }
    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .item-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }
    .item-list::-webkit-scrollbar {
      width: 5px;
    }
    .item-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .item-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(109, 74, 255, 0.3);
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .item-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .item-favicon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .item-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-username {
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-card-action {
      background: var(--bg-btn);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-card-action:hover {
      background: var(--bg-btn-hover);
      color: var(--text-main);
    }
    .btn-card-action.btn-fill {
      background: rgba(109, 74, 255, 0.16);
      border-color: rgba(109, 74, 255, 0.4);
      color: #B098FF;
    }
    .btn-card-action.btn-fill:hover {
      background: var(--accent);
      color: #fff;
    }
    .btn-card-action svg {
      width: 11px;
      height: 11px;
      fill: currentColor;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .empty-state svg {
      width: 32px;
      height: 32px;
      fill: var(--text-subtle);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.66 0 3 1.34 3 3v1h1c.55 0 1 .45 1 1v5c0 .55-.45 1-1 1H8c-.55 0-1-.45-1-1v-5c0-.55.45-1 1-1h1v-1c0-1.66 1.34-3 3-3zm0 2c-.55 0-1 .45-1 1v1h2v-1c0-.55-.45-1-1-1z"/>
        </svg>
      </div>
      <span>Kloak Vault</span>
    </div>
    <div class="header-actions">
      <button class="btn-header" id="btn-side-lock" title="Lock vault" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span>Lock</span>
      </button>
    </div>
  </div>

  <!-- UNLOCK VIEW (shown when vault is locked) -->
  <div class="view-container" id="side-unlock-view">
    <div class="unlock-card">
      <div class="unlock-icon-badge">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
      <div class="unlock-title">Unlock Kloak Vault</div>
      <div class="unlock-desc">Enter your master password to decrypt and access your credentials.</div>
      <form class="unlock-form" id="side-unlock-form">
        <div class="input-box">
          <input type="password" id="side-unlock-password" placeholder="Master Password" autocomplete="current-password" autofocus>
          <button type="button" class="input-icon-btn" id="btn-side-toggle-pwd" title="Toggle password visibility">
            <svg id="side-eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
        <div class="unlock-error" id="side-unlock-error"></div>
        <button type="submit" class="btn-submit" id="btn-side-submit-unlock">
          <div class="spinner" id="side-unlock-spinner"></div>
          <span id="side-unlock-btn-text">Unlock Vault</span>
        </button>
      </form>
    </div>
  </div>

  <!-- UNLOCKED VAULT VIEW -->
  <div class="view-container" id="side-unlocked-view" style="display: none;">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="side-search" placeholder="Search passwords, logins...">
    </div>
    <div class="item-list" id="side-items">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span>No credentials found</span>
      </div>
    </div>
  </div>

  <script src="../dist/sidepanel.js"></script>
</body>
</html>
