<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kloak Side Panel</title>
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .header {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .search-box {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      width: 100%;
    }
    .item-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
    }
    .item-card:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <span>Kloak Vault Panel</span>
  </div>
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="side-search" placeholder="Search passwords...">
  </div>
  <div class="item-list" id="side-items">
    <div class="item-card">
      <div style="font-weight: 600; font-size: 14px;">GitHub</div>
      <div style="color: #94a3b8; font-size: 12px;">alex.dev@github.com</div>
    </div>
    <div class="item-card">
      <div style="font-weight: 600; font-size: 14px;">ProtonMail</div>
      <div style="color: #94a3b8; font-size: 12px;">security@proton.me</div>
    </div>
  </div>
  <script src="../dist/sidepanel.js"></script>
</body>
</html>
