<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Vibrant Purple-Violet Squircle Gradient matching AppIcon.icon -->
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5936FF" />
      <stop offset="70%" stop-color="#8C19D8" />
      <stop offset="100%" stop-color="#7612C4" />
    </linearGradient>

    <!-- Soft Glass Specular Rim -->
    <linearGradient id="tileRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.48" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22" />
    </linearGradient>

    <!-- Padlock Shackle Glass Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7EFF" />
      <stop offset="100%" stop-color="#5BA2FF" />
    </linearGradient>

    <!-- Left Shield Facet -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Right Shield Facet -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Royal-Blue Beveled "K" Fill -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6370FF" />
      <stop offset="100%" stop-color="#3D46EC" />
    </linearGradient>

    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#140836" flood-opacity="0.55" />
    </filter>

    <filter id="kShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0C0626" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Tile -->
  <rect x="40" y="40" width="944" height="944" rx="224" fill="url(#bgGrad)" />
  <rect x="44" y="44" width="936" height="936" rx="220" stroke="url(#tileRim)" stroke-width="8" fill="none" />

  <!-- Top Padlock Shackle -->
  <path
    d="M 360 368 L 360 256 A 152 152 0 0 1 664 256 L 664 368"
    fill="none"
    stroke="url(#shackleGrad)"
    stroke-width="64"
    stroke-linecap="round"
  />
  <path
    d="M 360 368 L 360 256 A 152 152 0 0 1 664 256 L 664 368"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.32"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Faceted Split Shield -->
  <g filter="url(#shieldShadow)">
    <path
      d="M 512 248 L 210 334 L 210 628 C 210 818 512 942 512 942 Z"
      fill="url(#shieldLeft)"
    />
    <path
      d="M 512 248 L 814 334 L 814 628 C 814 818 512 942 512 942 Z"
      fill="url(#shieldRight)"
    />
    <!-- Center Fold Highlight -->
    <line x1="512" y1="252" x2="512" y2="936" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="6" />
    <!-- Sky-Cyan Outer Rim -->
    <path
      d="M 512 248 L 814 334 L 814 628 C 814 818 512 942 512 942 C 512 942 210 818 210 628 L 210 334 Z"
      fill="none"
      stroke="#7DD3FC"
      stroke-width="18"
      stroke-linejoin="round"
    />
  </g>

  <!-- Royal-Blue Beveled Geometric K -->
  <g filter="url(#kShadow)">
    <path
      d="M 378 424 L 440 424 L 440 744 L 378 744 Z M 440 604 L 560 424 L 642 424 L 492 634 L 652 744 L 560 744 L 440 624 Z"
      fill="url(#kGrad)"
      stroke="#93ACFF"
      stroke-opacity="0.72"
      stroke-width="8"
      stroke-linejoin="round"
    />
  </g>
</svg>
