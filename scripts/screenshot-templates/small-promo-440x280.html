<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kloak Small Promo Tile 440x280</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      background: #0D0C15;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Ambient Lighting */
    .ambient-glow-purple {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 220px;
      background: radial-gradient(circle, rgba(109, 74, 255, 0.35) 0%, rgba(109, 74, 255, 0) 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow-green {
      position: absolute;
      bottom: -30px;
      right: 15%;
      width: 220px;
      height: 160px;
      background: radial-gradient(circle, rgba(41, 201, 143, 0.2) 0%, rgba(41, 201, 143, 0) 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
      z-index: 1;
    }

    .tile-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      padding: 0 20px;
    }

    .logo-box {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 10px 24px rgba(109, 74, 255, 0.55));
      margin-bottom: 8px;
    }
    .logo-box svg {
      width: 100%;
      height: 100%;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2.2px;
      color: #FFFFFF;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: #B5A8FF;
      letter-spacing: 0.3px;
      margin-top: 3px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }

    /* Feature Pills */
    .pills-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .pill.autofill {
      background: rgba(109, 74, 255, 0.22);
      border: 1px solid rgba(109, 74, 255, 0.45);
      color: #C4B5FD;
    }

    .pill.touchid {
      background: rgba(167, 139, 250, 0.2);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #DDD6FE;
    }

    .pill.totp {
      background: rgba(41, 201, 143, 0.2);
      border: 1px solid rgba(41, 201, 143, 0.4);
      color: #29C98F;
    }

    .security-footer {
      margin-top: 14px;
      font-size: 9.5px;
      font-weight: 600;
      color: #7D798B;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-purple"></div>
  <div class="ambient-glow-green"></div>
  <div class="grid-overlay"></div>

  <div class="tile-container">
    <div class="logo-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e24" />
      <stop offset="45%" stop-color="#181342" />
      <stop offset="100%" stop-color="#341266" />
    </linearGradient>

    <!-- Shackle Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Shield Left Gradient -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Shield Right Gradient -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Neon Glow for K Emblem -->
    <filter id="k-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.49
        0 0 0 0 0.82
        0 0 0 0 0.98
        0 0 0 0.7 0" in="blur" result="colorGlow" />
      <feComposite in="SourceGraphic" in2="colorGlow" operator="over" />
    </filter>

    <!-- Glass Rim Highlight -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- App Tile Squircle Container -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tileGrad)" stroke="url(#glassRim)" stroke-width="4" />

  <!-- Inner Ambient Glow Behind Shield -->
  <circle cx="512" cy="540" r="300" fill="#6366F1" opacity="0.18" filter="blur(60px)" />

  <!-- Lock Shackle -->
  <g transform="translate(-0.64, -20)">
    <path d="M 360 400 L 360 270 A 152 152 0 0 1 664 270 L 664 400" 
          fill="none" stroke="url(#shackleGrad)" stroke-width="64" stroke-linecap="round" />
  </g>

  <!-- Shield Body -->
  <g transform="scale(1.02) translate(-10, 0)">
    <!-- Shield Left Half -->
    <path d="M 512 280 L 224 360 L 224 640 C 224 820 512 940 512 940 Z" 
          fill="url(#shieldLeft)" />
    <!-- Shield Right Half -->
    <path d="M 512 280 L 800 360 L 800 640 C 800 820 512 940 512 940 Z" 
          fill="url(#shieldRight)" />
    <!-- Cyan Outline Trim -->
    <path d="M 512 280 L 800 360 L 800 640 C 800 820 512 940 512 940 C 512 940 224 820 224 640 L 224 360 Z" 
          fill="none" stroke="#7DD3FC" stroke-width="14" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Stylized "K" Cipher Mark -->
  <g transform="translate(0, 0)">
    <path d="M 377 440 L 437 440 L 437 760 L 377 760 Z M 437 620 L 557 440 L 637 440 L 487 650 L 647 760 L 557 760 L 437 640 Z" 
          fill="#FFFFFF" filter="url(#k-glow)" />
  </g>
</svg>

    </div>

    <h1 class="brand-title">K L O A K</h1>
    <p class="brand-sub">Local-First Password Manager &amp; 2FA</p>

    <div class="pills-row">
      <div class="pill autofill">
        <span>⚡ 1-Click Autofill</span>
      </div>
      <div class="pill touchid">
        <span>🧬 Touch ID</span>
      </div>
      <div class="pill totp">
        <span>⏱️ 2FA TOTP</span>
      </div>
    </div>

    <div class="security-footer">
      <span>🔒 100% Zero-Knowledge • AES-256-GCM • Offline Vault</span>
    </div>
  </div>
</body>
</html>
