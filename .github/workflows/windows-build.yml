name: Build Windows Application

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Core and Daemon
        run: |
          npm run build --workspace=packages/core
          npm run build --workspace=packages/daemon

      - name: Build Windows Electron App
        run: npm run windows:build

      - name: Package Windows Distributable (NSIS Installer & Portable)
        run: npm run windows:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kloak-windows-installer
          path: packages/windows-app/release/*.exe
          if-no-files-found: warn
